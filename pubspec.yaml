name: descvideos
description: Descargador de videos publicos de Facebook e Instagram.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  receive_sharing_intent: ^1.8.1
  shared_preferences: ^2.3.3
  device_info_plus: ^11.1.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
